# PCBA AOI MVP 全局配置
# 所有关键阈值 / 路径 / 参数集中在此修改,代码中禁止硬编码

camera:
  index: 0            # 摄像头索引(本机实测仅 0 可用)
  width: 1280         # 请求分辨率(实测稳定 1280x720,1920x1080 不被支持)
  height: 720
  fps: 30
  backend: dshow      # Windows DirectShow
  warmup_frames: 8    # 打开后丢弃的预热帧数(等曝光稳定)

pcb:
  name: DEMO_PCB
  width_mm: 100.0     # PCB 物理宽度 (mm)
  height_mm: 70.0     # PCB 物理高度 (mm)
  px_per_mm: 8        # 对齐后标准图像的比例尺 (px/mm) -> 800x560
  # 4 个角 Mark 在 PCB 坐标系中的位置 (mm), 顺序: 左上/右上/右下/左下
  marks_mm:
    - [6.0, 6.0]
    - [94.0, 6.0]
    - [94.0, 64.0]
    - [6.0, 64.0]
  # 对齐图像中 PCB 有效区域边距 (px), 用于 pcb_mask
  board_margin_px: 4

mark:
  radius_px: 12       # Mark 在对齐图像中的半径 (px)
  template_threshold: 0.8   # 模板匹配最低得分
  hough_param1: 80    # HoughCircles Canny 高阈值
  hough_param2: 25    # HoughCircles 累加阈值
  min_dist_px: 40     # 圆心最小间距
  min_collinearity_area: 50.0  # 4 点围成面积下限,用于共线检查 (px^2)

alignment:
  method: homography  # homography(4点) / affine(3点)
  mark_threshold: 0.8
  reproj_error_max: 10.0  # Homography 重投影误差上限 (px)
  use_ransac: true        # 点数>4 时使用 RANSAC 鲁棒估计 (§9.3)

calibration:
  enabled: true
  parameter_file: "data/calibration/camera_calibration.json"
  require_resolution_match: true
  allow_skip_only_if_validated: true  # 跳过标定必须有记录理由 (§8)
  min_samples: 5            # 标定样本下限,不得仅凭单张图声称可靠
  board:                    # 标定板信息(棋盘格内角点布局)
    type: chessboard
    rows: 6                 # 内角点行数
    cols: 9                 # 内角点列数
    square_size: 25.0
    unit: mm

coordinate:
  unit: mm
  # DEMO_PCB 为自建合成板,坐标语义(绝对坐标/mm/左上原点/Y向下)由生成器定义,已确认;
  # 接入真实坐标报告时必须置 false,直到逐字段确认 (§10.2)
  coordinate_meaning_confirmed: true
  default_roundtrip_tolerance_mm: 0.1   # 初始软件测试目标,非产线保证值 (§11.1)

decision:
  uncertain_status: REVIEW      # 不确定时的判定 (§18)
  require_valid_calibration: true           # 无有效标定(或文档化豁免)时不得 PASS
  require_valid_coordinate_mapping: true    # 坐标语义未确认时不得 PASS

mask:
  polarity: 255   # 极性约定: 255=该区域有效/为真, 0=屏蔽 (§13)

panel:
  mode: single    # single / grid / auto (§9.1); DEMO_PCB 为单板
  rows: 1
  cols: 1
  spacing_x_mm: 0.0
  spacing_y_mm: 0.0
  rotation_deg: 0.0
  numbering: row_major   # row_major: BOARD_1..N 从左到右、从上到下

roi:
  default_expand: 0.2     # ROI 默认外扩比例(比例单位,非像素/mm,§12.4)
  reject_out_of_bounds: true   # 完全越界 ROI 拒绝而非裁剪
  overlap_warn_percent: 30     # 两 ROI 重叠面积占比超过该值则警告

illumination:
  blur: 3                 # 高斯模糊核 (奇数)
  normalize_brightness: true  # 亮度归一化(对齐到 golden 均值)
  clahe: false            # 可选 CLAHE
  clahe_clip: 2.0
  clahe_grid: 8

difference:
  threshold: 30       # 差分二值化阈值
  min_area: 10        # 异常区域面积下限 (px^2)
  max_area: 5000      # 面积上限 (过滤大面积光照变化)
  blur: 5             # 预处理高斯核(奇数;增大可抑制亚像素对齐残差)
  morphology: 3       # 形态学核大小
  min_mean_diff: 25   # 区域平均差值下限(过滤边缘重影噪声,实测缺陷>=38)
  edge_exclusion_px: 1  # golden 强边缘膨胀排除宽度(px),消除亚像素对齐残差重影;0=关闭

solder:
  min_area: 10
  max_area: 5000
  min_circularity: 0.2    # 圆度 4πA/P² 下限
  max_aspect_ratio: 8.0   # 长宽比上限

golden:
  dir_name: golden    # data/golden/<pcb_name>/golden.png

paths:
  data_dir: data
  output_dir: output
  logs_dir: logs
  log_file: aoi.log
